<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rombo 2D y 3D</title>
  <link rel="stylesheet" href="rombo.css">
</head>
<body>

  <!-- ================= PARTE 1: ROMBO 2D ================= -->
  <section class="seccion seccion-2d">
    <h1>Transformaciones 2D en un Rombo</h1>
    <p>Pasa el mouse sobre cada rombo para ver su transformación.</p>

    <div class="container">
      <div class="item">
        <div class="rombo">1</div>
        <span>Rotación</span>
      </div>

      <div class="item">
        <div class="rombo">2</div>
        <span>Traslación</span>
      </div>

      <div class="item">
        <div class="rombo">3</div>
        <span>Escalado</span>
      </div>

      <div class="item">
        <div class="rombo">4</div>
        <span>Sesgado</span>
      </div>
    </div>
  </section>

  <!-- ================= PARTE 2: ROMBO 3D ================= -->
  <section class="seccion seccion-3d">
    <h1>Rombo en 3D</h1>
    <p>Este rombo tiene 8 caras y gira solito. Pasa el mouse encima para pausarlo.</p>

    <div class="contenedor">
      <div class="rombo3d">
        <!-- Mitad de arriba -->
        <div class="cara arriba frente">1</div>
        <div class="cara arriba derecha">2</div>
        <div class="cara arriba atras">3</div>
        <div class="cara arriba izquierda">4</div>

        <!-- Mitad de abajo -->
        <div class="cara abajo frente">5</div>
        <div class="cara abajo derecha">6</div>
        <div class="cara abajo atras">7</div>
        <div class="cara abajo izquierda">8</div>
      </div>
    </div>
  </section>

</body>
</html>
